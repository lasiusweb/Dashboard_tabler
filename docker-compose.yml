---
services:

  # ─── Database ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: firstcrop-postgres
    environment:
      POSTGRES_DB: firstcrop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis (optional, for caching) ────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: firstcrop-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── API Server ───────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: firstcrop-api
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/firstcrop
      - REDIS_URL=redis://redis:6379
      - API_PORT=3002
      - NODE_ENV=development
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully
    volumes:
      - ./packages/api:/app/packages/api
      - /app/packages/api/node_modules
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002/api"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ─── DB Migration + Seed ─────────────────────────────────────────────────
  db-setup:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: firstcrop-db-setup
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/firstcrop
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./packages/db:/app/packages/db
      - /app/packages/db/node_modules
    command: >
      sh -c "npx prisma migrate deploy && npx prisma db seed"

  # ─── AI Agent ─────────────────────────────────────────────────────────────
  agent:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: firstcrop-agent
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/firstcrop
      - AGENT_MODEL=${AGENT_MODEL:-gpt-4o-mini}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DEFAULT_ORGANIZATION_ID=${DEFAULT_ORGANIZATION_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./packages/agent:/app/packages/agent
      - /app/packages/agent/node_modules
    command: ["tsx", "src/index.ts"]

  # ─── Tabler Dashboard ─────────────────────────────────────────────────────
  tabler:
    image: tabler
    container_name: tabler
    build: .
    ports:
      - 3000:3000
      - 3010:3010
    volumes:
      - ./core:/app/core
      - ./preview:/app/preview
      - ./docs:/app/docs
      - ./shared:/app/shared
      # keep the node_modules installed in the image (not overwritten by the mounts)
      - /app/core/node_modules
      - /app/preview/node_modules
      - /app/docs/node_modules
    tty: true

volumes:
  postgres_data:
  redis_data:
